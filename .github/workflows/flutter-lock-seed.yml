name: Flutter lock seed (temporary)

# Resolves bindings/flutter once with the pinned Flutter SDK and uploads the lockfile, so it can
# be reviewed and committed. Removed from the branch before it merges.
on:
  push:
    branches: [claude/flutter-publish-pins]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: Resolve the binding with the pinned SDK
        working-directory: bindings/flutter
        run: |
          flutter --version
          flutter pub get
          sha256sum pubspec.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: flutter-pubspec-lock
          path: bindings/flutter/pubspec.lock
          if-no-files-found: error
          retention-days: 3
