name: Publish · Python plugins

# PyPI Trusted Publishing of the Python plugin packages under integrations/ that install the
# published engine wheel: today the napari plugin, napari-qrcode-barcode-scanner. One build job and
# one publishing job per plugin. The build job builds the sdist and the wheel, holds them to the
# plugin's row of scripts/python-plugin-release.py, installs the wheel in a new environment and runs
# the plugin's tests on the mixed fixture in the fast, frame and full profiles (the Python host
# kit). The publishing job runs on the plugin's own tag only (napari-vX.Y.Z), in its protected
# environment, re-inspects the exact files the build recorded, compares them with what PyPI already
# serves and uploads them through OIDC: no token is stored anywhere. A dispatch builds and judges,
# and stops before PyPI. scripts/check-publish-guards.py holds every publishing job here to its row
# of PYPI_PLUGINS; RELEASING.md § Python plugin packages lists the owner's steps.
on:
  workflow_dispatch:
  push:
    tags:
      - "napari-v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  napari-build:
    name: napari plugin · build and judge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python scripts/python-plugin-release.py --self-test
      # On the tag, the tag names the version the plugin states; a dispatch only builds and judges.
      - run: python scripts/python-plugin-release.py gate --ref "$GITHUB_REF" --folder integrations/napari --dry-run
      - name: Build the sdist and the wheel and record their listing
        id: build
        run: |
          python -m pip install build==1.3.0 twine==7.0.0
          python scripts/python-plugin-release.py build --folder integrations/napari --out dist
          python -m twine check --strict dist/*
      # The engine version the reports must name is the one the plugin pins (the build step's output).
      - name: The built wheel in a new environment, its tests on the mixed fixture
        env:
          ENGINE_VERSION: ${{ steps.build.outputs.engine }}
        run: |
          mkdir -p receipt
          python scripts/python-host-consumer.py run \
            --destination "napari plugin, the distributions of this run (not published)" \
            --identifier napari-qrcode-barcode-scanner --version "$ENGINE_VERSION" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/integrations/napari" \
            --install "$(ls dist/napari_qrcode_barcode_scanner-*-py3-none-any.whl)" \
            --install "-r integrations/napari/tests/requirements.txt" \
            --scan "{python} -m pytest -q -p no:cacheprovider integrations/napari/tests" \
            --uninstall "napari-qrcode-barcode-scanner qrcode-barcode-scanner" \
            --gone-import napari_qrcode_barcode_scanner --gone-import qrcode_barcode_scanner \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt receipt/acceptance-napari-dist.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: napari-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: napari-acceptance
          path: receipt/
          if-no-files-found: error
          retention-days: 90

  napari-publish:
    name: napari plugin · publish to PyPI
    if: startsWith(github.ref, 'refs/tags/napari-v')
    needs: [napari-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi-napari
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC): no PyPI token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/python-plugin-release.py gate --ref "$GITHUB_REF" --folder integrations/napari
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: napari-dist
          path: dist
          digest-mismatch: error
      # The files about to be uploaded are the two the build job built, judged and recorded.
      - name: Re-inspect the set about to be uploaded
        env:
          DIST_SHA256: ${{ needs.napari-build.outputs.sha256 }}
        run: python3 scripts/python-plugin-release.py inspect dist --folder integrations/napari --sha256 "$DIST_SHA256"
      # skip-existing below skips a file PyPI already serves by its name alone: each such file must
      # first be the very file of this set. PyPI's public JSON is read with no credential.
      - name: Compare the files PyPI already serves with the inspected set
        run: python3 scripts/python-plugin-release.py pypi-live dist --folder integrations/napari
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
