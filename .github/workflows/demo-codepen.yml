name: Demo · CodePen

# The CodePen demo of examples/codepen, checked the way a visitor uses it: its three files served
# from one local origin, the engine loaded from the pinned jsDelivr files of the published WASM
# package 0.11.0 and the sample from the v0.11.0 tag, scanned in Chrome. The prefill form the
# owner uses to create the Pen is submitted too, but every request to codepen.io is answered on
# the runner: nothing is sent to CodePen, and nothing is published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/demo-codepen.yml
      - examples/codepen/**
      - distribution/acceptance/**
      - scripts/destination-acceptance.py
      - scripts/check-demo-page.py
      - fixtures/consumer-truth.json
      - fixtures/symbology/mixed-code128-qr.png
      - tests/wasm-browser/package.json
      - tests/wasm-browser/package-lock.json

permissions:
  contents: read

concurrency:
  group: demo-codepen-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pen:
    name: CodePen demo · Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: The prefill form holds the three files of the Pen
        run: python3 examples/codepen/build-prefill.py --check
      # The checks take Playwright from this project. They drive the Chrome of the runner image,
      # so no browser is downloaded.
      - name: Install Playwright for the page checks
        working-directory: tests/wasm-browser
        run: npm ci
      - name: Serve the Pen's files, scan through the page and judge the reports
        run: |
          set -euo pipefail
          (cd examples/codepen && exec python3 -m http.server 4174 --bind 127.0.0.1) >"$RUNNER_TEMP/serve.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:4174/; then break; fi
            if [ "$attempt" = 60 ]; then cat "$RUNNER_TEMP/serve.log"; exit 1; fi
            sleep 0.5
          done
          image=$(python3 scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          driver="$PWD/distribution/acceptance/drivers/web-page.mjs"
          (cd tests/wasm-browser && node "$driver" http://127.0.0.1:4174/ "$image" "$RUNNER_TEMP/reports" \
            --wait 180 --channel chrome)
          python3 scripts/check-demo-page.py "$RUNNER_TEMP/reports/page.json" --version 0.11.0 \
            --wasm-sha256 a5d684cec3863e210bbb7f473267dcf07a8321ff57bf17a321af58f5d261ab68 \
            --page-key sdk/javascript
          python3 scripts/destination-acceptance.py reports --kind page \
            --produced-by "node web-page.mjs http://127.0.0.1:4174/ --channel chrome" \
            --fast "$RUNNER_TEMP/reports/fast.json" \
            --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination "examples/codepen, served on the runner" \
            --identifier "@qrcode-ai-com/qrcode-barcode-scanner-wasm" --version 0.11.0 \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/examples/codepen" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "$RUNNER_TEMP/reports/receipt.json"
          # A Pen installs nothing on the visitor's machine: there is no removal to record.
          python3 scripts/destination-acceptance.py removed --not-applicable \
            --receipt "$RUNNER_TEMP/reports/receipt.json"
          # The sample in the three profiles, a dropped file, a file that is not an image, a
          # browser that refuses the worker, and a module whose bytes are not the pinned ones.
          (cd tests/wasm-browser && node "$GITHUB_WORKSPACE/examples/codepen/test/pen.mjs" \
            http://127.0.0.1:4174/ "$image" "$GITHUB_WORKSPACE/examples/codepen/style.css" \
            "$RUNNER_TEMP/reports" --channel chrome)
          (cd tests/wasm-browser && node "$GITHUB_WORKSPACE/examples/codepen/test/prefill.mjs" \
            http://127.0.0.1:4174/prefill.html "$GITHUB_WORKSPACE/examples/codepen" --channel chrome)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: demo-codepen
          path: |
            ${{ runner.temp }}/reports
            ${{ runner.temp }}/serve.log
          if-no-files-found: error
