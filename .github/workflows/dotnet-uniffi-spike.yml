name: .NET UniFFI spike

# A spike, not a package and not a release: does C# generated by uniffi-bindgen-cs load the
# engine's UniFFI library and scan in process? On Linux, macOS and Windows this builds the
# library with the locked UniFFI, generates the C# from that very file, builds a small program
# and judges its three scans with the destination acceptance driver. Nothing is published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dotnet-uniffi-spike.yml
      - bindings/dotnet/**

permissions:
  contents: read

concurrency:
  group: dotnet-uniffi-spike-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # The toolchain CI tests (ci.yml RUST_TOOLCHAIN).
  RUST_TOOLCHAIN: "1.99.1"
  # The generator release that targets the UniFFI line of the crate (0.31).
  BINDGEN_TAG: v0.11.1+v0.31.0

jobs:
  spike:
    name: .NET through UniFFI · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            library: libqrcode_ai_scanner_uniffi.so
          - runner: macos-15
            target: aarch64-apple-darwin
            library: libqrcode_ai_scanner_uniffi.dylib
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            library: qrcode_ai_scanner_uniffi.dll
    env:
      TARGET: ${{ matrix.target }}
      LIBRARY: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One Python on every host: the Windows image has no python3 command.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The crate is its own cargo root, with its own lock: UniFFI 0.31.2.
      - name: Build the native library with the locked UniFFI
        run: |
          cargo build --release --locked --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml
          ls -l "crates/qrcode-ai-scanner-uniffi/target/release/$LIBRARY"
          grep -A1 '^name = "uniffi"$' crates/qrcode-ai-scanner-uniffi/Cargo.lock
      - name: Install the C# generator at the tag of the same UniFFI line
        run: |
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --tag "$BINDGEN_TAG" --locked --root "$RUNNER_TEMP/bindgen"
      # Generated from the library that was just built, never from a checked-in file: the C# and
      # the native code then carry the same contract checksums.
      - name: Generate the C# from the built library
        working-directory: bindings/dotnet/spike
        run: |
          mkdir native
          cp "$GITHUB_WORKSPACE/crates/qrcode-ai-scanner-uniffi/target/release/$LIBRARY" native/
          "$RUNNER_TEMP/bindgen/bin/uniffi-bindgen-cs" --library --no-format --config uniffi.toml \
            --out-dir generated "native/$LIBRARY"
          ls -l generated
          grep -n -E '^namespace |static class |static .* (Scan|ScanFrame|Capabilities)\(' generated/*.cs | cut -c1-220 || true
      - name: Build the program
        working-directory: bindings/dotnet/spike
        run: |
          dotnet --list-sdks
          dotnet build QrscanSpike.csproj --configuration Release --output "$RUNNER_TEMP/spike" --nologo
      - name: Scan the mixed fixture with the three profiles, in process
        run: |
          mkdir receipt
          image=$(python scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          dotnet "$RUNNER_TEMP/spike/QrscanSpike.dll" "$image" "$RUNNER_TEMP/reports"
          python scripts/destination-acceptance.py reports --kind package \
            --produced-by "dotnet QrscanSpike.dll (Program.cs)" \
            --fast "$RUNNER_TEMP/reports/fast.json" \
            --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination ".NET spike from this checkout (not a package, not published)" \
            --identifier "bindings/dotnet/spike" \
            --version 0.11.0 \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/bindings/dotnet/spike" \
            --install "cargo build of the UniFFI crate, uniffi-bindgen-cs $BINDGEN_TAG, dotnet build" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "receipt/acceptance-dotnet-uniffi-$TARGET.json"
          python scripts/destination-acceptance.py removed --not-applicable \
            --receipt "receipt/acceptance-dotnet-uniffi-$TARGET.json"
          python scripts/destination-acceptance.py check "receipt/acceptance-dotnet-uniffi-$TARGET.json"
          cp "$RUNNER_TEMP/reports/facts.json" "receipt/facts-$TARGET.json"
          ls -l "crates/qrcode-ai-scanner-uniffi/target/release/$LIBRARY" > "receipt/library-$TARGET.txt"
          wc -l bindings/dotnet/spike/generated/*.cs >> "receipt/library-$TARGET.txt"
          cat "receipt/facts-$TARGET.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: dotnet-uniffi-spike-${{ matrix.target }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90
