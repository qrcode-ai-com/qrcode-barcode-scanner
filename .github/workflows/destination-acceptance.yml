name: Destination acceptance

# The acceptance contract of distribution/acceptance/README.md, run for real: the driver's
# self-test, then real consumers judged by the driver. One downloads the public CLI archive of a
# release anonymously, checks it against the release's checksum list, unpacks it and scans. Two
# install the public npm and PyPI packages in a new project and scan through them. One pulls the
# public container image by digest and scans inside it. One builds and installs the public AUR
# recipe in a new Arch Linux container. One starts the public MCP adapter the way a client does,
# with npx and an exact version, and scans through the protocol. Nothing is built from this
# repository's source and nothing is published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/destination-acceptance.yml
      - scripts/destination-acceptance.py
      - scripts/consumer_truth.py
      - distribution/acceptance/**
      - scripts/packed-cli-consumer.py
      - fixtures/consumer-truth.json
      - fixtures/symbology/mixed-code128-qr.png

permissions:
  contents: read

concurrency:
  group: destination-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  # The public release the consumer installs, and the sha256 of its checksum list.
  RELEASE_REPOSITORY: qrcode-ai-com/qrcode-barcode-scanner
  RELEASE_TAG: v0.11.0
  RELEASE_VERSION: 0.11.0
  SUMS_SHA256: 1b3263cf6c29af99fbcf9cc3f82e32febc7e598638292685fcd57c0656cc911e

jobs:
  self-test:
    name: Driver self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/destination-acceptance.py --self-test

  released-cli:
    name: Released CLI · ${{ matrix.target }}
    needs: self-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One Python on every host: the Windows image has no python3 command.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Download the public archive without a token and check it
        run: |
          python scripts/packed-cli-consumer.py fetch --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" \
            --sums-sha256 "$SUMS_SHA256" --target "$TARGET" --out "$RUNNER_TEMP/download"
      # The Windows archive is a zip and its command is qrscan.exe.
      - name: Unpack it outside the checkout
        run: |
          asset="qrcode-barcode-scanner-cli-$RELEASE_VERSION-$TARGET"
          mkdir "$RUNNER_TEMP/install" receipt
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$asset.zip" command="qrscan.exe" unpack="Expand-Archive $asset.zip"
            python -m zipfile -e "$RUNNER_TEMP/download/$archive" "$RUNNER_TEMP/install"
          else
            archive="$asset.tar.gz" command="qrscan" unpack="tar -xzf $asset.tar.gz"
            tar -xzf "$RUNNER_TEMP/download/$archive" -C "$RUNNER_TEMP/install"
          fi
          test -f "$RUNNER_TEMP/install/$asset/$command"
          {
            echo "ASSET=$asset"
            echo "ARCHIVE=$archive"
            echo "COMMAND=$command"
            echo "UNPACK=$unpack"
          } >> "$GITHUB_ENV"
      - name: Scan the mixed fixture with the three profiles
        run: |
          python scripts/destination-acceptance.py cli \
            --qrscan "$RUNNER_TEMP/install/$ASSET/$COMMAND" \
            --destination "GitHub Releases" \
            --identifier "$ARCHIVE" \
            --version "$RELEASE_VERSION" \
            --url "https://github.com/$RELEASE_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --install "$UNPACK" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "receipt/acceptance-$TARGET.json"
      - name: Remove it and close the receipt
        run: |
          rm -r "$RUNNER_TEMP/install/$ASSET"
          python scripts/destination-acceptance.py removed \
            --qrscan "$RUNNER_TEMP/install/$ASSET/$COMMAND" \
            --uninstall "rm -r $ASSET" \
            --receipt "receipt/acceptance-$TARGET.json"
          python scripts/destination-acceptance.py check "receipt/acceptance-$TARGET.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: destination-acceptance-${{ matrix.target }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90

  npm-package:
    name: npm package · Node.js ${{ matrix.node }}
    needs: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      PACKAGE: "@qrcode-ai-com/qrcode-barcode-scanner"
      NODE_LINE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the public package in a new project
        run: |
          mkdir "$RUNNER_TEMP/consumer" receipt
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$PACKAGE@$RELEASE_VERSION"
      - name: Scan the mixed fixture with the three profiles
        run: |
          image=$(python3 scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          (cd "$RUNNER_TEMP/consumer" &&
            node "$GITHUB_WORKSPACE/distribution/acceptance/drivers/node-package.mjs" "$image" "$RUNNER_TEMP/reports")
          python3 scripts/destination-acceptance.py reports --kind package \
            --produced-by "node node-package.mjs" \
            --fast "$RUNNER_TEMP/reports/fast.json" \
            --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination "npm" \
            --identifier "$PACKAGE" \
            --version "$RELEASE_VERSION" \
            --url "https://www.npmjs.com/package/$PACKAGE/v/$RELEASE_VERSION" \
            --install "npm install --save-exact $PACKAGE@$RELEASE_VERSION" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "receipt/acceptance-npm-node$NODE_LINE.json"
      # The check that the package is gone resolves it from the consumer project.
      - name: Uninstall it and close the receipt
        run: |
          cd "$RUNNER_TEMP/consumer"
          npm uninstall "$PACKAGE"
          python3 "$GITHUB_WORKSPACE/scripts/destination-acceptance.py" removed \
            --gone "node -e \"require.resolve('$PACKAGE')\"" \
            --uninstall "npm uninstall $PACKAGE" \
            --receipt "$GITHUB_WORKSPACE/receipt/acceptance-npm-node$NODE_LINE.json"
          python3 "$GITHUB_WORKSPACE/scripts/destination-acceptance.py" check \
            "$GITHUB_WORKSPACE/receipt/acceptance-npm-node$NODE_LINE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: destination-acceptance-npm-node${{ matrix.node }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90

  mcp-npx:
    name: MCP adapter started with npx · Node.js ${{ matrix.node }} · ${{ matrix.runner }}
    needs: self-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            node: "22"
          - runner: ubuntu-24.04
            node: "24"
          - runner: macos-15
            node: "24"
    env:
      # The public adapter and the launch entry of bundles and install links: npx, an exact
      # version, no install script.
      ADAPTER: "@qrcode-ai-com/qrcode-barcode-scanner-mcp"
      ADAPTER_VERSION: 0.2.1
      NAME: mcp-npx-node${{ matrix.node }}-${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # An empty home: npx finds no earlier copy and no configuration, as on a first start.
      - name: Start the public adapter with npx and scan through the protocol
        run: |
          mkdir "$RUNNER_TEMP/home" "$RUNNER_TEMP/work" receipt
          image=$(python3 scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          (cd "$RUNNER_TEMP/work" && HOME="$RUNNER_TEMP/home" \
            node "$GITHUB_WORKSPACE/distribution/acceptance/drivers/mcp-server.mjs" "$image" "$RUNNER_TEMP/reports" \
              -- npx --yes --ignore-scripts "$ADAPTER@$ADAPTER_VERSION")
          cp "$RUNNER_TEMP/reports/server.json" "receipt/server-$NAME.json"
          # The server that answered is the pinned adapter, and it ended when its input closed.
          jq -e --arg version "$ADAPTER_VERSION" \
            '.serverInfo.version == $version and (.tools | index("scan_image")) != null and .afterStdinClosed.code == 0' \
            "receipt/server-$NAME.json"
          python3 scripts/destination-acceptance.py reports --kind server \
            --produced-by "node mcp-server.mjs -- npx --yes --ignore-scripts $ADAPTER@$ADAPTER_VERSION" \
            --fast "$RUNNER_TEMP/reports/fast.json" \
            --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination "npm · MCP adapter started with npx" \
            --identifier "$ADAPTER@$ADAPTER_VERSION" \
            --version "$RELEASE_VERSION" \
            --url "https://www.npmjs.com/package/$ADAPTER/v/$ADAPTER_VERSION" \
            --install "npx --yes --ignore-scripts $ADAPTER@$ADAPTER_VERSION" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "receipt/acceptance-$NAME.json"
      # npx keeps what it started under _npx in npm's cache. Without it, a start that may not
      # install must fail. The command reads no input, so a server still there would end at once.
      - name: Remove the copy npx kept and close the receipt
        run: |
          rm -r "$RUNNER_TEMP/home/.npm/_npx"
          cd "$RUNNER_TEMP/work"
          HOME="$RUNNER_TEMP/home" python3 "$GITHUB_WORKSPACE/scripts/destination-acceptance.py" removed \
            --gone "sh -c 'npx --no $ADAPTER@$ADAPTER_VERSION < /dev/null'" \
            --uninstall "rm -r ~/.npm/_npx" \
            --receipt "$GITHUB_WORKSPACE/receipt/acceptance-$NAME.json"
          python3 "$GITHUB_WORKSPACE/scripts/destination-acceptance.py" check \
            "$GITHUB_WORKSPACE/receipt/acceptance-$NAME.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: destination-acceptance-${{ env.NAME }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90

  pypi-package:
    name: PyPI package · Python ${{ matrix.python }}
    needs: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      PACKAGE: qrcode-barcode-scanner
      PYTHON_LINE: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the public package in a new environment
        run: |
          mkdir receipt
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-cache-dir "$PACKAGE==$RELEASE_VERSION"
      - name: Scan the mixed fixture with the three profiles
        run: |
          image=$(python3 scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          "$RUNNER_TEMP/venv/bin/python" distribution/acceptance/drivers/python-package.py "$image" "$RUNNER_TEMP/reports"
          python3 scripts/destination-acceptance.py reports --kind package \
            --produced-by "python python-package.py" \
            --fast "$RUNNER_TEMP/reports/fast.json" \
            --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination "PyPI" \
            --identifier "$PACKAGE" \
            --version "$RELEASE_VERSION" \
            --url "https://pypi.org/project/$PACKAGE/$RELEASE_VERSION/" \
            --install "python -m pip install $PACKAGE==$RELEASE_VERSION" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "receipt/acceptance-pypi-python$PYTHON_LINE.json"
      - name: Uninstall it and close the receipt
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pip uninstall -y "$PACKAGE"
          python3 scripts/destination-acceptance.py removed \
            --gone "$RUNNER_TEMP/venv/bin/python -c 'import qrcode_barcode_scanner'" \
            --uninstall "python -m pip uninstall -y $PACKAGE" \
            --receipt "receipt/acceptance-pypi-python$PYTHON_LINE.json"
          python3 scripts/destination-acceptance.py check "receipt/acceptance-pypi-python$PYTHON_LINE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: destination-acceptance-pypi-python${{ matrix.python }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90

  container-image:
    name: Container image · ${{ matrix.platform }}
    needs: self-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            machine: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: arm64
    env:
      # The verified multi-platform index of distribution/docker/v0.11/README.md.
      QRSCAN_IMAGE: ghcr.io/qrcode-ai-com/qrcode-barcode-scanner@sha256:fd0433f29b0dabd469ce6a8fdcfc7bf6554960301b5bc57b5fca97928fd7cb96
      MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's Docker holds no registry credential: the pull is anonymous.
      - name: Pull the public image by digest
        run: |
          mkdir receipt
          test ! -e "$HOME/.docker/config.json" || ! grep -q ghcr.io "$HOME/.docker/config.json"
          docker pull "$QRSCAN_IMAGE"
      - name: Scan the mixed fixture with the three profiles
        run: |
          python3 scripts/destination-acceptance.py cli --kind container \
            --qrscan distribution/acceptance/drivers/qrscan-in-container.sh \
            --destination "GitHub Container Registry" \
            --identifier "$QRSCAN_IMAGE" \
            --version "$RELEASE_VERSION" \
            --url "https://github.com/$RELEASE_REPOSITORY/pkgs/container/qrcode-barcode-scanner" \
            --install "docker pull $QRSCAN_IMAGE" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "receipt/acceptance-container-$MACHINE.json"
      - name: Remove the image and close the receipt
        run: |
          docker rmi "$QRSCAN_IMAGE"
          python3 scripts/destination-acceptance.py removed \
            --gone "docker image inspect $QRSCAN_IMAGE" \
            --uninstall "docker rmi $QRSCAN_IMAGE" \
            --receipt "receipt/acceptance-container-$MACHINE.json"
          python3 scripts/destination-acceptance.py check "receipt/acceptance-container-$MACHINE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: destination-acceptance-container-${{ matrix.machine }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90

  # The package of the Arch User Repository, taken as its users take it: the public recipe is
  # cloned signed out, built with makepkg and installed with pacman in a new Arch Linux
  # container. The recipe must equal the copy recorded in distribution/aur/.
  aur-package:
    name: AUR package · Arch Linux x86_64
    needs: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, install, scan and uninstall in a new Arch Linux container
        run: |
          set -euo pipefail
          mkdir receipt
          docker pull --quiet archlinux:latest
          docker image inspect --format '{{index .RepoDigests 0}}' archlinux:latest | tee receipt/aur-host-image.txt
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/engine,readonly" \
            --mount "type=bind,src=$PWD/receipt,dst=/receipt" \
            archlinux:latest sh /engine/distribution/acceptance/drivers/aur-on-arch.sh /receipt \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Validate the receipt on the runner
        run: python3 scripts/destination-acceptance.py check receipt/acceptance-aur.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: destination-acceptance-aur
          path: receipt/
          if-no-files-found: error
          retention-days: 90
