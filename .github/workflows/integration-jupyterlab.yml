name: Integrations · JupyterLab

# The JupyterLab extension under integrations/jupyterlab: a prebuilt extension, one Python wheel
# that holds the built frontend and the published browser engine it bundles, the way JupyterLab 4
# installs extensions with pip and lists them in its Extension Manager. Its unit tests run the
# bundled WebAssembly module under Node on the mixed fixture. The wheel and the sdist are built
# from the lockfile and checked the way PyPI reads them, then the Python host kit installs the
# wheel with JupyterLab in a new virtual environment, starts JupyterLab headless, scans the mixed
# fixture through the panel's own file input in the fast, frame and full profiles (Chrome of the
# runner image), judges the panel's links and the module it names, scans the same file from the
# file browser, uninstalls the wheel and checks that JupyterLab no longer has the extension.
# Nothing is built from the engine's Rust source and nothing is published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/integration-jupyterlab.yml
      - integrations/jupyterlab/**
      - scripts/python-host-consumer.py
      - scripts/python_host_kit.py
      - scripts/destination-acceptance.py
      - scripts/check-demo-page.py
      - distribution/acceptance/drivers/web-page.mjs
      - tests/wasm-browser/package.json
      - tests/wasm-browser/package-lock.json
      - fixtures/symbology/mixed-code128-qr.png

permissions:
  contents: read

concurrency:
  group: integration-jupyterlab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The JupyterLab the clean consumer installs, and the builder of the labextension.
  JUPYTERLAB_VERSION: 4.6.6
  JUPYTER_BUILDER_VERSION: 1.3.0
  FOLDER: integrations/jupyterlab

jobs:
  extension:
    name: JupyterLab extension · build, install and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Self-tests of the kit and the judges
        run: |
          python scripts/python-host-consumer.py --self-test
          python scripts/destination-acceptance.py --self-test
          python scripts/check-demo-page.py --self-test
      # The engine the extension bundles is the exact published package its package.json names.
      - name: Read the engine version the extension pins
        run: |
          engine=$(node -p "require('./$FOLDER/package.json').dependencies['@qrcode-ai-com/qrcode-barcode-scanner-wasm']")
          [[ "$engine" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ENGINE_VERSION=$engine" >> "$GITHUB_ENV"
          echo "engine $engine"
      - name: Install from the lockfile and run the unit tests
        working-directory: ${{ env.FOLDER }}
        run: |
          npm ci
          npm test
      # build:prod refuses a bundle whose WebAssembly module is not the published one, and writes
      # the engine's license files beside the extension's own. The archives take their dates from
      # the commit, in UTC.
      - name: Build the labextension, the wheel and the sdist
        working-directory: ${{ env.FOLDER }}
        run: |
          python -m pip install "jupyter-builder==$JUPYTER_BUILDER_VERSION" build==1.3.0 twine==7.0.0
          npm run build:prod
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) TZ=UTC python -m build --outdir dist
          python -m twine check --strict dist/*
          (cd dist && sha256sum -- *)
      # The page drivers take Playwright from this project. They drive the Chrome of the runner
      # image, so no browser is downloaded.
      - name: Install Playwright for the page drivers
        working-directory: tests/wasm-browser
        run: npm ci
      - name: The wheel in a new environment with JupyterLab, scanned through the panel
        run: |
          mkdir -p receipt
          wheel=$(ls "$FOLDER"/dist/jupyterlab_qrcode_barcode_scanner-*-py3-none-any.whl)
          python scripts/python-host-consumer.py run \
            --destination "JupyterLab extension, the wheel of this run in JupyterLab $JUPYTERLAB_VERSION (not published)" \
            --identifier jupyterlab-qrcode-barcode-scanner --version "$ENGINE_VERSION" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/$FOLDER" \
            --install "jupyterlab==$JUPYTERLAB_VERSION $wheel" \
            --scan "{python} $FOLDER/tests/lab_acceptance.py {image} {out}" \
            --kind page \
            --uninstall "jupyterlab-qrcode-barcode-scanner" \
            --gone-import jupyterlab_qrcode_barcode_scanner \
            --venv "$RUNNER_TEMP/consumer" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt receipt/acceptance-jupyterlab.json
      # pip removed the files; JupyterLab must no longer find or list the extension.
      - name: JupyterLab no longer has the extension
        run: |
          test ! -e "$RUNNER_TEMP/consumer/share/jupyter/labextensions/@qrcode-ai-com/jupyterlab-qrcode-barcode-scanner"
          listed=$("$RUNNER_TEMP/consumer/bin/jupyter" labextension list 2>&1)
          printf '%s\n' "$listed"
          count=$(printf '%s\n' "$listed" | grep -c 'jupyterlab-qrcode-barcode-scanner' || true)
          test "$count" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: jupyterlab-dist
          path: ${{ env.FOLDER }}/dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: jupyterlab-acceptance
          path: receipt/
          if-no-files-found: error
          retention-days: 90
