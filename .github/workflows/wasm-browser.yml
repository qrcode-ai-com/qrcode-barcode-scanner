name: wasm-browser

on:
  workflow_call:

permissions:
  contents: read

jobs:
  packed-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # The packed step also runs the camera, destination, example and overlay suites and the overlay
    # witnesses. On a laptop with Chromium, Firefox and Playwright WebKit the step took 9.1 to 9.5
    # min over two runs, of which the overlay witnesses took 3.4 to 3.8 min (Chromium 53-58 s,
    # Firefox 96-118 s, WebKit 53 s) and the overlay suite 52 s. This job runs no WebKit, but
    # installs Chromium and Firefox and adds the SIMD-disabled Chromium; no timing from these
    # runners exists yet. Each overlay witness has a three-minute deadline, so a stalled page fails
    # its witnesses instead of holding the job until this limit cancels it. If the receipt's phases
    # put this job near 20 min, move the overlay witnesses to a job of their own rather than raising
    # this limit. WebKit (QRSCAN_TEST_WEBKIT=1) runs locally only: its Linux and Windows builds are
    # not yet qualified on these runner images.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-wasm-tarball
          path: ${{ runner.temp }}/wasm-tarball
      - name: pinned runtime with a real SIMD disable switch
        shell: bash
        run: node scripts/install-no-simd-browser.mjs "$RUNNER_TEMP/qrscan-no-simd"
      - name: fresh Vite worker, SSR, declarations and browser parity
        shell: bash
        env:
          QRSCAN_INSTALL_BROWSERS: '1'
          QRSCAN_TEST_FIREFOX: '1'
        run: |
          set -euo pipefail
          archives=("$RUNNER_TEMP"/wasm-tarball/*.tgz)
          test "${#archives[@]}" -eq 1
          node scripts/packed-wasm-browser.mjs "${archives[0]}" "$RUNNER_TEMP/packed-browser.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: wasm-browser-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/packed-browser.json
            ${{ runner.temp }}/qrscan-no-simd/browser-receipt.json
          if-no-files-found: error
