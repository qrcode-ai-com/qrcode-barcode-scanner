name: Chocolatey Windows consumer

# Qualifies the package built here or, on request, the version the Chocolatey Community
# Repository serves. No registry uploads or secrets.
on:
  workflow_dispatch:
    inputs:
      source:
        description: The package built here, or the one the Community Repository serves
        type: choice
        options:
          - local-package
          - community-feed
        default: local-package
  push:
    branches: [codex/chocolatey-consumer]

permissions:
  contents: read

jobs:
  install-scan-uninstall:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, scan and uninstall
        shell: pwsh
        env:
          PACKAGE_SOURCE: ${{ inputs.source || 'local-package' }}
        run: ./distribution/chocolatey/test.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'Chocolatey consumer') -Source $env:PACKAGE_SOURCE
      - name: Save the package and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chocolatey-${{ inputs.source || 'local-package' }}-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Chocolatey consumer/packages/*.nupkg
            ${{ runner.temp }}/Chocolatey consumer/receipt.json
          if-no-files-found: error
          retention-days: 30
