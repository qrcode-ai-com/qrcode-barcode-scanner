name: integration-browser-extension

# The browser extension of integrations/browser-extension, checked the way its README describes:
# installed from its own lockfile, built into the three store zips and the source zip, held to the
# hashes its SHA256SUMS pins, inspected and linted for Firefox. Each store zip is then extracted or
# installed as a store receives it and driven in a new profile: the Chrome and the Edge zips in
# Playwright's Chromium, the Chrome zip again in the runner's Google Chrome, the Firefox zip in the runner's own Firefox through WebDriver BiDi, and
# the Firefox build's page in Playwright's Firefox. The store screenshots and promotional tiles
# are captured again from the Chrome build. The reports are judged by the repository's page
# and acceptance judges, the packages are rebuilt from the source zip, and the reproduce job
# rebuilds them on Linux, macOS and Windows with Node.js 22 and 24 in two time zones, each time to
# the pinned bytes. It uses the published WASM package: nothing is built from this repository's
# Rust source, and nothing is uploaded to a store.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/integration-browser-extension.yml
      - integrations/browser-extension/**
      - fixtures/symbology/mixed-code128-qr.png
      - scripts/destination-acceptance.py
      - scripts/check-demo-page.py
  push:
    branches: [main]
    paths:
      - .github/workflows/integration-browser-extension.yml
      - integrations/browser-extension/**
      - fixtures/symbology/mixed-code128-qr.png
      - scripts/destination-acceptance.py
      - scripts/check-demo-page.py

permissions:
  contents: read

concurrency:
  group: integration-browser-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Browser extension · build, inspect and test
    runs-on: ubuntu-24.04
    # On an Apple Silicon laptop the build, the checks and both browser tests took 41 s on
    # 20 November 2026. The browser download with its system packages took 188 s and more on these
    # runners for wasm-browser.yml; no timing from this job exists yet.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: integrations/browser-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tool versions
        run: |
          node --version
          npm --version
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Install Playwright's Chromium and Firefox
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Build the store zips and the source zip, to the pinned hashes
        run: npm run check:pins
      - name: Inspect the archives
        run: npm run inspect
      - name: Unit tests
        run: npm test
      - name: Firefox add-on linter
        run: npm run lint:firefox
      - name: The Chrome zip and the Edge zip, each extracted and loaded in Playwright's Chromium
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for target in chrome edge; do
            node test/chromium.mjs --package "build/qrcode-barcode-scanner-$target-$version.zip" \
              --out "build/acceptance/$target"
          done
      - name: The Chrome zip in the runner's Google Chrome
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          google-chrome --version
          node test/chromium.mjs --channel chrome \
            --package "build/qrcode-barcode-scanner-chrome-$version.zip" \
            --out build/acceptance/chrome-stable
      - name: The store images, captured from the Chrome build
        run: node scripts/store-images.mjs --extension build/chrome --out build/store-images
      - name: The Firefox zip installed in the runner's Firefox
        timeout-minutes: 5
        run: |
          set -euo pipefail
          FIREFOX=$(command -v firefox)
          "$FIREFOX" --version
          FIREFOX="$FIREFOX" npm run test:firefox-addon
      - name: The Firefox build's page in Playwright's Firefox
        run: npm run test:firefox-page
      - name: Judge the page records and the reports
        working-directory: .
        run: |
          set -euo pipefail
          here=integrations/browser-extension
          version=$(node -p "require('./$here/build/build-receipt.json').scanner.version")
          mkdir -p "$RUNNER_TEMP/receipts"
          for record in chrome/popup chrome/menu chrome-stable/popup chrome-stable/menu \
            edge/popup edge/menu firefox-addon firefox-page; do
            reports="$here/build/acceptance/$record"
            python3 scripts/check-demo-page.py "$reports/page.json" \
              --example "$here" --page-key integrations/browser-extension
            case "$record" in
              firefox-addon) driver="node test/firefox-addon.mjs" ;;
              firefox-page) driver="node test/firefox-page.mjs" ;;
              *) driver="node test/chromium.mjs" ;;
            esac
            python3 scripts/destination-acceptance.py reports --kind page \
              --produced-by "$driver" \
              --fast "$reports/fast.json" --frame "$reports/frame.json" \
              --full "$reports/full.json" \
              --destination "$here, $record, on the runner" \
              --identifier "@qrcode-ai-com/qrcode-barcode-scanner-wasm" --version "$version" \
              --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/$here" \
              --install "npm ci --ignore-scripts && npm run build" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --receipt "$RUNNER_TEMP/receipts/${record//\//-}.json"
          done
      - name: Rebuild from the source zip and compare
        run: npm run test:reproduce
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: browser-extension
          path: |
            integrations/browser-extension/build/*.zip
            integrations/browser-extension/build/*.json
            integrations/browser-extension/build/SHA256SUMS
            integrations/browser-extension/build/store-assets
            integrations/browser-extension/build/store-images
            integrations/browser-extension/build/acceptance
            ${{ runner.temp }}/receipts
          if-no-files-found: error

  # The same bytes everywhere: three systems, the two supported Node.js lines and two time zones,
  # each build held to SHA256SUMS. Only the build's own dependency is installed, as SOURCE.md tells
  # a reviewer to do.
  reproduce:
    name: Reproduce the archives · ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: integrations/browser-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Tool versions
        run: |
          node --version
          npm --version
          node -p 'process.platform + "-" + process.arch + " zlib " + process.versions.zlib'
      - name: Install the build's one dependency from the lockfile
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build in UTC, then in UTC+14, each to the pinned hashes
        run: |
          set -euo pipefail
          TZ=UTC node scripts/build.mjs --out "$RUNNER_TEMP/utc" --check
          TZ=Pacific/Kiritimati node scripts/build.mjs --out "$RUNNER_TEMP/kiritimati" --check
          cmp "$RUNNER_TEMP/utc/SHA256SUMS" SHA256SUMS
          cmp "$RUNNER_TEMP/kiritimati/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
