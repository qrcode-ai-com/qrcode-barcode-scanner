name: integration-adobe-express

# The Adobe Express add-on of integrations/adobe-express, checked the way its README describes:
# installed from its own lockfile, built into the package Adobe Express takes (engine inlined by
# integrations/wasm-inline into the scanner worker), rebuilt to compare the bytes, unit tested, run
# in Playwright's Chromium with a stand-in for the add-on panel and a fake add-on SDK, judged by the
# repository's acceptance judge, and given its listing images. It uses the published WASM package:
# nothing is built from this repository's Rust source, and nothing is uploaded to Adobe.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/integration-adobe-express.yml
      - integrations/adobe-express/**
      - integrations/wasm-inline/inline.mjs
      - fixtures/symbology/mixed-code128-qr.png
      - scripts/destination-acceptance.py
  push:
    branches: [main]
    paths:
      - .github/workflows/integration-adobe-express.yml
      - integrations/adobe-express/**
      - integrations/wasm-inline/inline.mjs
      - fixtures/symbology/mixed-code128-qr.png
      - scripts/destination-acceptance.py

permissions:
  contents: read

concurrency:
  group: integration-adobe-express-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adobe-express:
    name: Adobe Express add-on · build, test in a stand-in panel
    runs-on: ubuntu-24.04
    # On an Apple Silicon laptop the build, the unit tests and the browser test took under a
    # minute on 21 November 2026; the browser download with its system packages takes longer here.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: integrations/adobe-express
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tool versions
        run: |
          node --version
          npm --version
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Install Playwright's Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build the package
        run: npm run build
      - name: Rebuild and compare the bytes
        run: |
          set -euo pipefail
          zip=build/qrcode-barcode-scanner-adobe-express-0.1.0.zip
          first=$(sha256sum "$zip")
          npm run build
          second=$(sha256sum "$zip")
          echo "$second"
          [ "$first" = "$second" ]
      - name: Unit tests
        run: npm test
      - name: The package in Playwright's Chromium, in a stand-in panel
        run: npm run test:express
      - name: Judge the reports
        working-directory: .
        run: |
          set -euo pipefail
          here=integrations/adobe-express
          reports="$here/build/acceptance"
          mkdir -p "$RUNNER_TEMP/receipts"
          python3 scripts/destination-acceptance.py reports --kind page \
            --produced-by "node test/express-panel.mjs" \
            --fast "$reports/fast.json" --frame "$reports/frame.json" --full "$reports/full.json" \
            --destination "$here, the add-on package in a stand-in panel, on the runner" \
            --identifier "@qrcode-ai-com/qrcode-barcode-scanner-wasm" --version 0.11.0 \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/$here" \
            --install "npm ci --ignore-scripts && npm run build" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "$RUNNER_TEMP/receipts/adobe-express.json"
      - name: Listing images
        run: npm run listing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: adobe-express-add-on
          path: |
            integrations/adobe-express/dist
            integrations/adobe-express/build
            ${{ runner.temp }}/receipts
          if-no-files-found: error
