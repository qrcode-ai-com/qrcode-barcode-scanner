name: mcp-registry-publish

# Lists one already published npm version. All inputs are pinned in the
# helper. The read-only job proves the environment before GitHub can schedule
# the OIDC job, and the publisher checks it again before authenticating.
on: workflow_dispatch

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.repository == 'qrcode-ai-com/qrcode-barcode-scanner' && github.repository_id == '1126991539'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      missing: ${{ steps.inspect.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inspect
        run: python3 scripts/mcp-registry-publish.py inspect

  publish:
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.repository == 'qrcode-ai-com/qrcode-barcode-scanner' && github.repository_id == '1126991539' && needs.verify.outputs.missing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: mcp-registry
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/mcp-registry-publish.py publish
