name: integration-snap

# Packs the Snap Store recipe (distribution/snap) on each architecture and judges the installed
# snap. The recipe repacks the published v0.11.0 Linux release archives after checking their
# SHA-256; nothing is compiled. Nothing is uploaded and no secret is read: the owner uploads the
# tested .snap from the artifact (distribution/snap/README.md).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "distribution/snap/**"
      - ".github/workflows/integration-snap.yml"

permissions:
  contents: read

concurrency:
  group: integration-snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: test the launcher hint
        run: sh distribution/snap/test-launcher.sh
      - name: pack the snap from the release archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic --channel 9.x/stable
          snapcraft --version
          cp -R distribution/snap "$RUNNER_TEMP/snap"
          cd "$RUNNER_TEMP/snap"
          sudo snapcraft pack --destructive-mode --platform "$ARCHITECTURE" \
            --output "qrcode-barcode-scanner_0.11.0_$ARCHITECTURE.snap"
          sha256sum "qrcode-barcode-scanner_0.11.0_$ARCHITECTURE.snap"
      - name: install the snap and judge it
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          snap_file="$RUNNER_TEMP/snap/qrcode-barcode-scanner_0.11.0_$ARCHITECTURE.snap"
          sudo snap install --dangerous "$snap_file"
          snap connections qrcode-barcode-scanner
          # The snap has its own /tmp; the acceptance copy of the fixture goes to the home folder.
          mkdir -p "$HOME/qrscan-acceptance"
          mkdir -p receipts
          TMPDIR="$HOME/qrscan-acceptance" python3 scripts/destination-acceptance.py cli \
            --qrscan qrcode-barcode-scanner.qrscan --destination "Snap Store" --version 0.11.0 \
            --url https://snapcraft.io/qrcode-barcode-scanner --identifier qrcode-barcode-scanner \
            --install "sudo snap install --dangerous qrcode-barcode-scanner_0.11.0_$ARCHITECTURE.snap" \
            --run-url "$RUN_URL" --receipt "receipts/acceptance-snap-$ARCHITECTURE.json"
          # An image outside the confinement keeps qrscan's exit status and gets the hint.
          cp fixtures/symbology/mixed-code128-qr.png /tmp/qrscan-outside.png
          status=0
          qrcode-barcode-scanner.qrscan /tmp/qrscan-outside.png 2>hint.txt || status=$?
          test "$status" -eq 2
          grep -qF 'The snap has its own /tmp' hint.txt
          sudo snap remove --purge qrcode-barcode-scanner
          python3 scripts/destination-acceptance.py removed --qrscan qrcode-barcode-scanner.qrscan \
            --uninstall "sudo snap remove --purge qrcode-barcode-scanner" \
            --receipt "receipts/acceptance-snap-$ARCHITECTURE.json"
          python3 scripts/destination-acceptance.py check "receipts/acceptance-snap-$ARCHITECTURE.json"
          cp "$snap_file" receipts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: qrscan-snap-${{ matrix.architecture }}
          path: receipts/
          if-no-files-found: error
          retention-days: 14
