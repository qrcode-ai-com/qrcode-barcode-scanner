name: integration-glama

# Builds the Glama listing's container from the staged listing repository, the way Glama builds
# it (root Dockerfile), and judges the MCP server inside it with the destination acceptance
# contract. It installs the published npm adapter 0.3.1 and compiles no Rust. No upload, no
# secret; the image is removed at the end.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "distribution/glama/**"
      - "scripts/stage-glama-package.py"
      - ".github/workflows/integration-glama.yml"

permissions:
  contents: read

concurrency:
  group: integration-glama-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: stage the listing repository from this commit
        run: |
          set -euo pipefail
          python3 scripts/stage-glama-package.py --self-test
          python3 scripts/stage-glama-package.py stage --out "$RUNNER_TEMP/listing"
          python3 scripts/stage-glama-package.py verify "$RUNNER_TEMP/listing"
      - name: build the container as Glama does, from the root Dockerfile
        run: |
          set -euo pipefail
          docker build --pull -t qrscan-mcp:glama "$RUNNER_TEMP/listing"
      - name: scan the mixed fixture through the MCP server in the container
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          image=$(python3 scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          node distribution/acceptance/drivers/mcp-server.mjs "$image" "$RUNNER_TEMP/reports" -- \
            docker run -i --rm --network none --read-only --cap-drop ALL qrscan-mcp:glama
          mkdir -p receipt
          python3 scripts/destination-acceptance.py reports --kind server \
            --produced-by "docker run -i --rm --network none --read-only --cap-drop ALL qrscan-mcp:glama" \
            --fast "$RUNNER_TEMP/reports/fast.json" --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination "Glama container (linux/$ARCHITECTURE, before listing)" --version 0.11.0 \
            --url "https://github.com/qrcode-ai-com/qrcode-barcode-scanner-mcp" \
            --identifier "@qrcode-ai-com/qrcode-barcode-scanner-mcp@0.3.1" \
            --install "docker build of the staged listing repository" --run-url "$RUN_URL" \
            --receipt "receipt/acceptance-glama-$ARCHITECTURE.json"
          docker rmi qrscan-mcp:glama
          python3 scripts/destination-acceptance.py removed --gone "docker image inspect qrscan-mcp:glama" \
            --uninstall "docker rmi qrscan-mcp:glama" --receipt "receipt/acceptance-glama-$ARCHITECTURE.json"
          python3 scripts/destination-acceptance.py check "receipt/acceptance-glama-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: integration-glama-${{ matrix.architecture }}
          path: receipt/
          if-no-files-found: ignore
