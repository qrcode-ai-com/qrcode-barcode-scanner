name: Pages

# The browser example of examples/web-vite on GitHub Pages: built from its lockfile, deployed from
# main, then opened at its public address and judged as demos.yml judges it on the runner. The page
# installs the published WebAssembly package: nothing is built from this repository's Rust source.
# deploy holds the only write permissions, in the shape scripts/check-publish-guards.py § Pages
# allows. Until the owner selects GitHub Actions as the Pages source, configure-pages fails.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - examples/web-vite/**

permissions:
  contents: read

# One run at a time, and a deployment is never cancelled halfway: a later run waits.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://qrcode-ai-com.github.io/qrcode-barcode-scanner-rust/

jobs:
  build:
    name: Build the browser example for its Pages address
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages reads the repository's Pages site.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # A hosted editor imports the example's folder alone, so the sample lives in it as a copy.
      - name: The example's sample is the checked fixture
        run: cmp fixtures/symbology/mixed-code128-qr.png examples/web-vite/public/samples/mixed-code128-qr.png
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The page is built for the address the README gives. With a custom domain Pages would serve
      # it elsewhere, and the page would look for its files under a path that does not exist there.
      - name: Pages serves this repository at its documented address
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "${BASE_URL%/}/" != "$SITE" ]; then
            echo "::error::GitHub Pages serves this repository at $BASE_URL, not at $SITE"
            exit 1
          fi
      - name: Install the example from its lockfile and build it under the site's path
        working-directory: examples/web-vite
        run: |
          npm ci
          npm run build -- --base /qrcode-barcode-scanner-rust/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/web-vite/dist

  # One pinned step and no checkout: no code of this repository runs with the Pages token.
  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.repository == 'qrcode-ai-com/qrcode-barcode-scanner-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Scan through the live page and judge the reports
    needs: [deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Self-tests of the two judges
        run: |
          python3 scripts/destination-acceptance.py --self-test
          python3 scripts/check-demo-page.py --self-test
      # check-demo-page.py reads the module the page must name from the example's node_modules:
      # the lockfile the deployed page was built from installs the same one.
      - name: Install the example from its lockfile
        working-directory: examples/web-vite
        run: npm ci
      # The page driver takes Playwright from the project it runs in. It drives the Chrome of the
      # runner image, so no browser is downloaded.
      - name: Install Playwright for the page driver
        working-directory: tests/wasm-browser
        run: npm ci
      - name: Open the deployed page, scan through it and judge the reports
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ "${PAGE_URL%/}/" != "$SITE" ]; then
            echo "::error::GitHub Pages deployed to $PAGE_URL, not to $SITE"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --silent --fail --location --output /dev/null "$SITE"; then break; fi
            if [ "$attempt" = 30 ]; then echo "::error::$SITE did not answer"; exit 1; fi
            sleep 10
          done
          package=@qrcode-ai-com/qrcode-barcode-scanner-wasm
          version=$(node -p "require('./examples/web-vite/package.json').dependencies['$package']")
          image=$(python3 scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          driver="$PWD/distribution/acceptance/drivers/web-page.mjs"
          (cd tests/wasm-browser && node "$driver" "$SITE" "$image" "$RUNNER_TEMP/reports" \
            --wait 120 --channel chrome)
          python3 scripts/check-demo-page.py "$RUNNER_TEMP/reports/page.json" --example examples/web-vite
          python3 scripts/destination-acceptance.py reports --kind page \
            --produced-by "node web-page.mjs $SITE --channel chrome" \
            --fast "$RUNNER_TEMP/reports/fast.json" \
            --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination "GitHub Pages" \
            --identifier "$package" --version "$version" \
            --url "$SITE" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt "$RUNNER_TEMP/reports/receipt.json"
          # A page installs nothing on the visitor's machine: there is no removal to record.
          python3 scripts/destination-acceptance.py removed --not-applicable \
            --receipt "$RUNNER_TEMP/reports/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: pages-web-vite
          path: ${{ runner.temp }}/reports
          if-no-files-found: error
