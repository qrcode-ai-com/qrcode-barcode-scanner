name: Integration · Apify image

# The Apify Actor under integrations/apify, as the Apify platform builds and starts it. Its Python
# tests run in integration-python-hosts.yml without Docker; this workflow builds the image from the
# Actor's own Dockerfile on Apify's base image and runs it the way a run on the platform starts it,
# with a local storage whose INPUT record names the mixed fixture, served over HTTP from the
# runner, in the fast, frame and full profiles. The destination acceptance driver judges the three
# reports, then the image is removed and must be gone. One more run does what the Apify Store's
# daily test does: the input schema's prefill, fetched from its public address, must succeed with a
# non-empty dataset in under five minutes. The Actor's definition files are validated against the
# schemas Apify publishes and with Apify's own CLI, and the Store page (STORE.md) and the license
# notes are checked. Nothing is pushed to Apify and no Apify account is used.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/integration-apify.yml
      - integrations/apify/**
      - scripts/destination-acceptance.py
      - scripts/consumer_truth.py
      - fixtures/consumer-truth.json
      - fixtures/symbology/mixed-code128-qr.png

permissions:
  contents: read

concurrency:
  group: integration-apify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  IMAGE: qrscan-apify-actor:ci
  ENGINE_VERSION: 0.11.0

jobs:
  image:
    name: Build the Actor image and run it on the mixed fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
      # Without a path it validates the input schema (named in actor.json) and the dataset schema.
      - name: The definition files with Apify's CLI
        working-directory: integrations/apify
        env:
          APIFY_CLI_DISABLE_TELEMETRY: "1"
        run: |
          npm exec --yes apify-cli@1.13.0 -- validate-schema .actor/input_schema.json
          npm exec --yes apify-cli@1.13.0 -- validate-schema
      - name: The definition files against Apify's published schemas
        run: |
          mkdir -p "$RUNNER_TEMP/schemas"
          for kind in actor input dataset output; do
            curl -fsSL --retry 3 "https://apify.com/schemas/v1/$kind.ide.json" -o "$RUNNER_TEMP/schemas/$kind.ide.json"
          done
          (cd "$RUNNER_TEMP/schemas" && shasum -a 256 ./*.ide.json)
          python -m pip install -r integrations/apify/requirements.txt -r integrations/apify/tests/requirements.txt jsonschema==4.26.0
          QRSCAN_APIFY_SCHEMAS="$RUNNER_TEMP/schemas" python -m pytest -q -p no:cacheprovider \
            integrations/apify/tests/test_actor.py -k "published_schemas or definition_is_consistent or store_page or engine_notices"
      - name: Build the image from the Actor's Dockerfile
        run: |
          docker build --pull -t "$IMAGE" integrations/apify
          docker image inspect "$IMAGE" --format 'image {{.Id}} · {{.Size}} bytes · {{.Architecture}}'
          docker image inspect apify/actor-python:3.12 --format 'base {{index .RepoDigests 0}}'
          docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' |
            grep -Fx AGPL-3.0-or-later
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import importlib.metadata as m; print(m.version('qrcode-barcode-scanner'))" | grep -Fx "$ENGINE_VERSION"
          docker run --rm --entrypoint sha256sum "$IMAGE" licenses/engine-0.11.0/THIRD-PARTY.md \
            licenses/engine-0.11.0/LICENSE-APACHE-2.0
      - name: Run the image on the mixed fixture in the three profiles, then the daily test input
        run: |
          image=$(python scripts/destination-acceptance.py stage "$RUNNER_TEMP/input")
          python integrations/apify/tests/image_consumer.py --image "$IMAGE" --fixture "$image" \
            --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/runs" \
            --prefill integrations/apify/.actor/input_schema.json
      - name: Judge the three reports
        run: |
          mkdir -p kit
          cp "$RUNNER_TEMP"/runs/*.log kit/
          python scripts/destination-acceptance.py reports --kind package \
            --produced-by "python integrations/apify/tests/image_consumer.py (docker run of the Actor image)" \
            --fast "$RUNNER_TEMP/reports/fast.json" \
            --frame "$RUNNER_TEMP/reports/frame.json" \
            --full "$RUNNER_TEMP/reports/full.json" \
            --destination "Apify Actor image built from this checkout (not pushed)" \
            --identifier qrcode-barcode-scanner@0.1 \
            --version "$ENGINE_VERSION" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/integrations/apify" \
            --install "docker build integrations/apify" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt kit/acceptance-apify-image.json
      - name: Remove the image and close the receipt
        env:
          UNINSTALL: docker image rm qrscan-apify-actor:ci
          GONE: docker image inspect qrscan-apify-actor:ci
        run: |
          eval "$UNINSTALL"
          python scripts/destination-acceptance.py removed --gone "$GONE" --uninstall "$UNINSTALL" \
            --receipt kit/acceptance-apify-image.json
          python scripts/destination-acceptance.py check kit/acceptance-apify-image.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apify-image-acceptance
          path: kit/
          if-no-files-found: error
          retention-days: 90
