name: distribution-checks

# Unprivileged build/runtime qualification only. No registry uploads or secrets.
# Untrusted event fields are never interpolated into shell scripts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "distribution/docker/**"
      - ".github/workflows/distribution-checks.yml"

permissions:
  contents: read

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify public CLI inputs and prepare a minimal context
        run: |
          set -euo pipefail
          python3 distribution/docker/v0.11/prepare.py --self-test
          env -u GH_TOKEN -u GITHUB_TOKEN python3 distribution/docker/v0.11/prepare.py \
            --assets "$RUNNER_TEMP/qrscan-public-assets" --out "$RUNNER_TEMP/qrscan-oci-context" \
            --receipt qualified/preparation.json
      - name: package unchanged public CLI bytes in the pinned runtime base
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          docker version
          normalize() {
            case "$1" in
              x86_64|amd64) printf '%s' amd64 ;;
              aarch64|arm64) printf '%s' arm64 ;;
              *) return 1 ;;
            esac
          }
          test "$(normalize "$(uname -m)")" = "$ARCHITECTURE"
          test "$(normalize "$(docker info --format '{{.Architecture}}')")" = "$ARCHITECTURE"
          docker build --no-cache --network none -f distribution/docker/v0.11/Dockerfile \
            --platform "linux/$ARCHITECTURE" --build-arg "PACKAGING_REVISION=$GITHUB_SHA" \
            -t qrscan:qualified "$RUNNER_TEMP/qrscan-oci-context"
      - name: execute mounted input, shared truth and mixed profiles without network or write access
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          python3 distribution/docker/v0.11/verify.py qrscan:qualified fixtures/clean/gen_v5_q.png \
            --expected-platform "linux/$ARCHITECTURE" --packaging-revision "$GITHUB_SHA" --native \
            --receipt qualified/consumer.json
      - name: export the tested image without rebuilding
        run: |
          set -euo pipefail
          python3 distribution/docker/v0.11/record.py qrscan:qualified \
            --consumer qualified/consumer.json --out qualified-export
          cp qualified/preparation.json qualified-export/preparation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qrscan-oci011-${{ matrix.architecture }}
          path: qualified-export/
          if-no-files-found: error
          retention-days: 14
