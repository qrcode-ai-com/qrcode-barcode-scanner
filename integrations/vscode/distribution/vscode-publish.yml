name: vscode-publish

# Staged from qrcode-ai-com/qrcode-barcode-scanner-rust by
# integrations/vscode/scripts/stage-distribution.mjs; never edited by hand.
# A tag vscode-v<version> rebuilds the VSIX from the engine revision named in
# vscode/SOURCE.json, refuses it unless its SHA-256 is the staged one, then publishes
# that same file to the Visual Studio Marketplace (Trusted Publishing, no token) and
# to Open VSX (the OVSX_PAT secret of the open-vsx environment).
on:
  push:
    tags: ["vscode-v*"]

permissions:
  contents: read

concurrency:
  group: vscode-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      vsix: ${{ steps.source.outputs.vsix }}
      sha256: ${{ steps.source.outputs.sha256 }}
      revision: ${{ steps.source.outputs.revision }}
      node: ${{ steps.source.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the staged source and check the tag
        id: source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e '
            const s = require("./vscode/SOURCE.json");
            if (process.env.TAG !== `vscode-v${s.version}`) throw new Error(`tag ${process.env.TAG} is not vscode-v${s.version}`);
            for (const key of ["revision", "vsix", "sha256", "node"]) console.log(`${key}=${s[key]}`);
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qrcode-ai-com/qrcode-barcode-scanner-rust
          ref: ${{ steps.source.outputs.revision }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.source.outputs.node }}
          package-manager-cache: false
      - name: rebuild, test and check the VSIX
        working-directory: engine/integrations/vscode
        env:
          WANT: ${{ steps.source.outputs.sha256 }}
          VSIX: ${{ steps.source.outputs.vsix }}
        run: |
          set -euo pipefail
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run package
          npm run test:vsix
          echo "$WANT  out/$VSIX" | sha256sum --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: vsix
          path: engine/integrations/vscode/out/${{ steps.source.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

  marketplace:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: visual-studio-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qrcode-ai-com/qrcode-barcode-scanner-rust
          ref: ${{ needs.build.outputs.revision }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix
      - name: publish the checked VSIX with Trusted Publishing
        working-directory: engine/integrations/vscode
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
          VSIX: ${{ runner.temp }}/vsix/${{ needs.build.outputs.vsix }}
        run: |
          set -euo pipefail
          node --version
          npm --version
          echo "$WANT  $VSIX" | sha256sum --check
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/@vscode/vsce/vsce publish --oidc --packagePath "$VSIX"

  open-vsx:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: open-vsx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix
      - name: publish the checked VSIX to Open VSX
        working-directory: vscode
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
          VSIX: ${{ runner.temp }}/vsix/${{ needs.build.outputs.vsix }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          node --version
          npm --version
          echo "$WANT  $VSIX" | sha256sum --check
          npm ci --ignore-scripts --no-audit --no-fund
          # ovsx reads the token from OVSX_PAT: it never appears on a command line.
          node node_modules/ovsx/bin/ovsx publish --packagePath "$VSIX"
