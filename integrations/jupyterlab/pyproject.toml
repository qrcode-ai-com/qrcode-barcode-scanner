[build-system]
requires = ["hatchling==1.33.0", "hatch-nodejs-version==0.4.0", "jupyter-builder==1.3.0"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-qrcode-barcode-scanner"
readme = "README.md"
# The extension's own code is MIT; the WebAssembly engine bundled in the labextension is the
# published @qrcode-ai-com/qrcode-barcode-scanner-wasm 0.11.0, AGPL-3.0-or-later. LICENSE-NOTES.md
# says which file is which; licenses/ is written by the build from the engine package itself.
license = "MIT AND AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-NOTES.md", "licenses/*"]
requires-python = ">=3.9"
authors = [{ name = "Thibaut Mélen" }, { name = "Nicolas Cella" }]
keywords = ["jupyter", "jupyterlab", "jupyterlab-extension", "qr-code", "barcode", "scanner", "webassembly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# A prebuilt extension: JupyterLab is the user's, so it is not a dependency.
dependencies = []
dynamic = ["version", "description"]

[project.urls]
Homepage = "https://qrcode-ai.com/en-US/qr-code-scanner/integrations/jupyterlab"
Source = "https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust/tree/main/integrations/jupyterlab"
"Bug Tracker" = "https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust/issues"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_qrcode_barcode_scanner/labextension", "licenses"]
exclude = ["tests", "node_modules", "lib", "media"]

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_qrcode_barcode_scanner"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_qrcode_barcode_scanner/labextension" = "share/jupyter/labextensions/@qrcode-ai-com/jupyterlab-qrcode-barcode-scanner"
"install.json" = "share/jupyter/labextensions/@qrcode-ai-com/jupyterlab-qrcode-barcode-scanner/install.json"

[tool.hatch.build.hooks.version]
path = "jupyterlab_qrcode_barcode_scanner/_version.py"

# The labextension is built before `python -m build` (`npm ci`, then `npm run build:prod`), from
# the committed lockfile. The hook only checks that it is there and never runs npm itself.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder==0.10.0"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_qrcode_barcode_scanner/labextension/static/style.js",
    "jupyterlab_qrcode_barcode_scanner/labextension/package.json",
    "licenses/ENGINE.json",
    "jupyterlab_qrcode_barcode_scanner/labextension/licenses/ENGINE.json",
]
skip-if-exists = ["jupyterlab_qrcode_barcode_scanner/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]
