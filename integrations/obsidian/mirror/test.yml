name: Test

# This repository is generated from the engine repository,
# https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust (integrations/obsidian):
# SOURCE.json names the commit and the sha256 of every file. Nothing here is edited by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plugin:
    name: Build and test the plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      # Chromium runs Obsidian on desktop and Android, WebKit on iPhone and iPad.
      - run: npx playwright-core install --with-deps chromium webkit
      - name: Tests on the mixed fixture, in Node and in both browser engines
        env:
          QRSCAN_OBSIDIAN_BROWSERS: required
        run: npm test
      - run: npm run build

  provenance:
    name: Every file comes from the engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The engine's own program stages the commit SOURCE.json names and compares it with this
      # tree: same files, same bytes, nothing else.
      - name: Stage the recorded engine commit again and compare
        run: |
          revision=$(python3 -c "import json; print(json.load(open('SOURCE.json'))['engine']['revision'])")
          git init --quiet "$RUNNER_TEMP/engine"
          git -C "$RUNNER_TEMP/engine" remote add origin https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust
          git -C "$RUNNER_TEMP/engine" fetch --quiet --depth 1 origin "$revision"
          git -C "$RUNNER_TEMP/engine" checkout --quiet FETCH_HEAD
          python3 "$RUNNER_TEMP/engine/scripts/stage-obsidian-satellite.py" verify "$GITHUB_WORKSPACE"
