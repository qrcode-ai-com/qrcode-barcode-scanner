name: Tests

# The node's own tests, run in its own repository against the published engine wheel. This tree is
# written from the engine repository by scripts/stage-comfyui-satellite.py; edit it there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # The CPU build of torch: the default Linux and Windows wheels carry CUDA, which no test needs.
      - name: Install the node's requirements and the test tools
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Run the tests
        shell: bash
        run: python -m pytest -q tests
