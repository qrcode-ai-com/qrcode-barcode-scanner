name: Test

# This repository is generated from the engine repository,
# https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust (integrations/github-action):
# SOURCE.json names the commit and the sha256 of every file. Nothing here is edited by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test

  provenance:
    name: Every file comes from the engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The engine's own program stages the commit SOURCE.json names and compares it with this
      # tree: same files, same bytes, nothing else.
      - name: Stage the recorded engine commit again and compare
        run: |
          revision=$(python3 -c "import json; print(json.load(open('SOURCE.json'))['engine']['revision'])")
          git init --quiet "$RUNNER_TEMP/engine"
          git -C "$RUNNER_TEMP/engine" remote add origin https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust
          git -C "$RUNNER_TEMP/engine" fetch --quiet --depth 1 origin "$revision"
          git -C "$RUNNER_TEMP/engine" checkout --quiet FETCH_HEAD
          python3 "$RUNNER_TEMP/engine/scripts/stage-action-satellite.py" verify "$GITHUB_WORKSPACE"

  scan:
    name: Scan · ${{ matrix.runner }} · ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
        profile: [fast, frame, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the mixed fixture
        id: mixed
        uses: ./
        with:
          files: test/fixtures/mixed-code128-qr.png
          expected: |
            https://qrc-ai.com/76xMa
            STOCK-4827
          profile: ${{ matrix.profile }}
      - name: A payload that is not in the image
        id: mismatch
        continue-on-error: true
        uses: ./
        with:
          files: test/fixtures/mixed-code128-qr.png
          expected: STOCK-0000
          profile: ${{ matrix.profile }}
      - name: A file that is not an image
        id: unreadable
        continue-on-error: true
        uses: ./
        with:
          files: README.md
          profile: ${{ matrix.profile }}
      - name: Judge the three results
        env:
          MIXED_RESULT: ${{ steps.mixed.outputs.result }}
          MIXED_REPORT: ${{ steps.mixed.outputs.report }}
          MISMATCH_OUTCOME: ${{ steps.mismatch.outcome }}
          MISMATCH_RESULT: ${{ steps.mismatch.outputs.result }}
          UNREADABLE_OUTCOME: ${{ steps.unreadable.outcome }}
          UNREADABLE_RESULT: ${{ steps.unreadable.outputs.result }}
        run: node test/judge-ci.mjs
