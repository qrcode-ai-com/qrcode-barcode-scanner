[build-system]
# maturin 1.9.0 added PEP 639 license files and 1.9.3 fixed adding them to
# source distributions: an older backend can build this package without the
# AGPL text.
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "qrcode-barcode-scanner"
description = "QR decoding + scannability scoring for artistic, AI-generated, and photo-captured QR codes — Rust core via PyO3."
requires-python = ">=3.8"
readme = "README.md"
license = "AGPL-3.0-or-later"
# PEP 639: the AGPL text ships in the wheel (.dist-info/licenses/) and the
# sdist. It is this directory's copy of the root LICENSE (maturin packs from
# here, so the root file never reached a 0.9.0 archive).
license-files = ["LICENSE"]
keywords = ["qrcode", "qr", "scanner", "decoder", "barcode", "validation"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "jsonschema", "pillow"]

[project.urls]
Homepage = "https://qrcode-ai.com/en-US/qr-code-scanner/sdk/python"
Repository = "https://github.com/qrcode-ai-com/qrcode-barcode-scanner"
Documentation = "https://github.com/qrcode-ai-com/qrcode-barcode-scanner/tree/v0.11.0/docs"

[tool.maturin]
module-name = "qrcode_barcode_scanner"
# The sdist relocates pyproject.toml above the vendored crates. Pure-Rust
# wheel builds look for the module stub beside that file, not beside the
# relocated Cargo.toml; carry these exact files at the sdist root too.
include = [
  { path = "qrcode_barcode_scanner.pyi", format = "sdist" },
  { path = "py.typed", format = "sdist" },
]

[tool.maturin.generate-ci.github]
trusted-publishing = true
