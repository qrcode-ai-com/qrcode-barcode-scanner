[package]
name = "qrcode-barcode-scanner-cli"
description = "CLI for QR code decoding and scannability scoring — artistic, AI-generated, and photo-captured QR codes"
keywords = ["qrcode", "qr", "scanner", "cli", "validation"]
categories = ["command-line-utilities", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://qrcode-ai.com/en-US/qr-code-scanner/cli"
authors.workspace = true

[[bin]]
name = "qrscan"
path = "src/main.rs"

[dependencies]
qrcode-barcode-scanner = { version = "0.11.0", path = "../qrcode-ai-scanner", features = ["serde"] }
clap = { workspace = true }
serde_json.workspace = true

# Cargo installs this packaged crate as the build root; workspace profiles do
# not travel with dependencies. Keep the decoder's arithmetic guard there too.
[profile.release.package.rxing]
overflow-checks = true

[lints]
workspace = true

[dev-dependencies]
image.workspace = true
jsonschema.workspace = true
qrcode.workspace = true
serde_json.workspace = true
