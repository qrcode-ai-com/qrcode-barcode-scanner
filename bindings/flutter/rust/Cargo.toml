# Flutter/Dart bindings crate for qrcode-ai-scanner (flutter_rust_bridge v2).
#
# LOCATION (deliberate): the Rust crate lives INSIDE the Flutter package
# (bindings/flutter/rust/) rather than the repo's crates/ tree. This is REQUIRED,
# not a style preference — `dart pub publish` only ships files under the package
# root, so a crate in crates/ would never reach pub.dev consumers (who build it
# at app-build time via cargokit). The binding plan §3.2 sanctions this fallback.
#
# Excluded from the cargo workspace (root Cargo.toml): built by cargokit at
# Flutter app-build time, not by `cargo --workspace`. Versions are spelled out
# (excluded crates cannot inherit `workspace = true`). Edition stays 2021 (what
# FRB's `integrate` generated frb_generated.rs against); the crate may depend on
# the edition-2024 core regardless (editions are per-crate).
[package]
name = "qrcode_ai_scanner"
version = "0.11.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/qrcode-ai-com/qrcode-barcode-scanner-rust"
description = "Flutter/Dart bindings for qrcode-ai-scanner — QR decoding + scannability scoring for artistic / AI-generated QR codes."
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde_json = "1"
# The core, aliased to dodge a name clash with this crate's lib name (both
# default to `qrcode_ai_scanner`) — same trick as the py/uniffi bindings. The
# `serde` feature is the JSON wire contract shared by every surface.
scanner-core = { package = "qrcode-barcode-scanner", path = "../../../crates/qrcode-ai-scanner", features = ["serde"] }

# The flutter crate is workspace-excluded, so the root [profile.release]
# (lto/strip) does NOT apply — restate it or the native lib ships unstripped and
# un-LTO'd, bloating every ABI (binding plan §10 gotcha #7).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# ...and its safety setting: rxing 0.9.1 can underflow on adversarial pixels,
# and overflow-checks turn that into a panic the engine wrapper catches
# instead of a runaway allocation (root Cargo.toml has the history). cargokit
# builds this crate as its own root inside the consuming app's build, so this
# manifest is the only place the setting can live.
[profile.release.package.rxing]
overflow-checks = true

# Debug builds. Simulators and emulators run Flutter only in debug mode, and in
# debug mode cargokit builds this crate with Cargo's dev profile. As its own
# root, the crate does not inherit the engine workspace's [profile.dev] either:
# without this table every crate here builds at opt-level 0, and on the iOS
# simulator a scan of the mixed QR/Code 128 fixture took 7336 ms in `fast`
# (budget 800 ms) and 6438 ms in `full` (budget 4000 ms), both cut by their
# budgets (consumer runs of 21 November 2026, bindings/flutter/README.md).
#
# opt-level 3 is the release profile's optimization, and debug-assertions off
# drops the standard library's and the dependencies' debug checks from the
# pixel loops, as release does. Overflow checks stay on, the dev default, for
# every crate; rxing is pinned below like in release. Debug info, incremental
# builds and codegen units keep Cargo's dev defaults: no LTO and no single
# codegen unit here, because a debug build with thin LTO and one codegen unit
# built but its iOS simulator test app never connected to the test runner.
[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = true

[profile.dev.package.rxing]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
