name: qr_barcode_scanner
description: >-
  Scan QR codes and barcodes locally from images or camera frames, with
  versioned reports and QR scannability diagnostics from the native Rust engine.
version: 0.11.0
repository: https://github.com/qrcode-ai-com/qrcode-barcode-scanner
homepage: https://qrcode-ai.com/en-US/qr-code-scanner/sdk/flutter
topics:
  - qr
  - barcode
  - scanner
  - ffi

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # EXACT pin, NOT ^2.12.0 — the Dart runtime, the Rust crate (rust/Cargo.toml
  # `=2.12.0`), and the codegen CLI must be the SAME version or FRB panics at
  # runtime with a codec-version mismatch (the cost: `pub publish` warns about a
  # tight constraint; that's the accepted FRB lock-step tradeoff). Bump all three
  # together. The generated bindings under lib/src/rust are tied to this version.
  flutter_rust_bridge: 2.12.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter


# First-party source is MIT; see LICENSE and the repo-root LICENSING.md.
# Published archives retain the license shipped with their version.

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
